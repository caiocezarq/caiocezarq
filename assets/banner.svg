<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-label="Caio Cezar Queiroz · Product Owner | SaaS B2B, Integrações ERP &amp; AI Product Management">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="55%" stop-color="#0D1527"/>
      <stop offset="100%" stop-color="#0A1931"/>
    </linearGradient>
    <linearGradient id="blueLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="60%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="85%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#070B14" stop-opacity="0"/>
    </radialGradient>
    <style>
      .name { font: 800 42px 'Plus Jakarta Sans', 'Segoe UI', Inter, Helvetica, Arial, sans-serif; fill: #F8FAFC; letter-spacing: -0.5px; }
      .role { font: 600 19px 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif; fill: #60A5FA; }
      .sub { font: 400 15.5px 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif; fill: #94A3B8; }
    </style>
  </defs>

  <rect width="1200" height="220" rx="10" fill="url(#bg)" stroke="#1E293B" stroke-width="2"/>
  <rect width="1200" height="220" rx="10" fill="url(#glow)"/>

  <text x="56" y="88" class="name">Caio Cezar Queiroz</text>
  <text x="56" y="124" class="role">Product Owner | SaaS B2B, Integrações ERP &amp; AI Product Management</text>
  <text x="56" y="158" class="sub">Evolução de produtos digitais B2B, integrações corporativas e aplicação prática de Inteligência Artificial.</text>

  <rect x="56" y="180" width="360" height="3" rx="1.5" fill="url(#blueLine)"/>
